<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Arena</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><defs><linearGradient id='p' x1='0' y1='1' x2='1' y2='0'><stop offset='0' stop-color='%231c5cab'/><stop offset='0.5' stop-color='%233987e5'/><stop offset='1' stop-color='%2322d3ee'/></linearGradient></defs><path fill='url(%23p)' d='M9.3 2.7 Q10 1.5 10.7 2.7 L18.4 16 Q19.1 17.2 17.7 17.2 L2.3 17.2 Q0.9 17.2 1.6 16 Z'/><path fill='%23fff' opacity='0.22' d='M10 1.9 L18.1 16.1 Q18.8 17.2 17.7 17.2 L10 17.2 Z'/></svg>">
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="." aria-label="AI Arena">
      <svg class="brand-mark" viewBox="0 0 126 22" width="172" height="30" role="img" aria-label="AI Arena">
        <defs>
          <linearGradient id="prism" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#1c5cab"/>
            <stop offset="0.5" stop-color="#3987e5"/>
            <stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        <path fill="url(#prism)" d="M9.4 3.6 Q10 2.55 10.6 3.6 L17.2 15.05 Q17.8 16.1 16.6 16.1 L3.4 16.1 Q2.2 16.1 2.8 15.05 Z"/>
        <path fill="#fff" opacity="0.22" d="M10 2.9 L16.9 15 Q17.5 16.1 16.6 16.1 L10 16.1 Z"/>
        <text class="bm-txt" x="24" y="16.2" letter-spacing="-0.2">AI Arena</text>
      </svg>
    </a>
    <nav class="tabs" id="tabs">
      <button data-view="overview" class="tab active">Overview</button>
      <button data-view="stats" class="tab">Stats</button>
      <button data-view="prompts" class="tab">Prompts</button>
      <button data-view="setup" class="tab">Setup<span class="tab-dot" id="setup-dot" hidden></span></button>
      <button data-view="about" class="tab">About</button>
    </nav>
    <div class="topbar-right">
      <span id="me-pill" class="pill"></span>
      <button id="help-toggle" class="icon-btn txt" title="What is shared, what stays local">Privacy</button>
      <button id="theme-toggle" class="icon-btn" title="Toggle theme">◐</button>
      <div id="help-pop" class="popover" hidden></div>
    </div>
  </header>

  <div class="shell">
    <aside class="side" id="sidebar" aria-label="Filters"></aside>
    <div class="main">
      <main id="view" class="view" aria-live="polite"></main>
      <footer class="foot">
        <span>Costs are <em>API-equivalent estimates</em> from <code>pricing.json</code> — ≈ marks unverified prices.</span>
        <span id="foot-meta"></span>
      </footer>
    </div>
  </div>
</div>
<div id="tooltip" class="tooltip" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
